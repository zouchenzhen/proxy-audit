name: Security and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m unittest discover -s tests -v

      - name: Static syntax checks
        shell: pwsh
        run: |
          python -m compileall -q scripts tests
          node --check web/app.js
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'start-web.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }

      - name: Scan full Git history for sensitive material
        run: python scripts/scan_git_history.py
